<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicSynth API Demo</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .section h2 {
            margin-top: 0;
            color: #ffd700;
        }
        
        .file-input {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            cursor: pointer;
        }
        
        .file-input:hover {
            border-color: #ffd700;
        }
        
        .btn {
            background: linear-gradient(45deg, #ffd700, #ffed4e);
            color: #333;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            margin: 10px 5px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .status {
            margin: 15px 0;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        
        .status.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4caf50;
            color: #4caf50;
        }
        
        .status.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }
        
        .status.info {
            background: rgba(33, 150, 243, 0.2);
            border: 1px solid #2196f3;
            color: #2196f3;
        }
        
        .video-container {
            margin-top: 20px;
            text-align: center;
        }
        
        video {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: #ffd700;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .api-url {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            border-radius: 5px;
            font-family: monospace;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 MusicSynth API Demo</h1>
        
        <div class="section">
            <h2>API Configuration</h2>
            <label for="apiUrl">API Base URL:</label>
            <input type="text" id="apiUrl" value="http://localhost:8000" class="api-url" style="width: 100%; color: white; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.3); padding: 8px; border-radius: 5px;">
        </div>
        
        <div class="section">
            <h2>📷 Process Image</h2>
            <p>Upload a sheet music image (PNG, JPG, JPEG) to generate a video visualization.</p>
            
            <input type="file" id="imageFile" accept=".png,.jpg,.jpeg" class="file-input">
            <button onclick="processImage()" id="processImageBtn" class="btn">Process Image</button>
            
            <div id="imageStatus" class="status" style="display: none;"></div>
            <div id="imageVideoContainer" class="video-container"></div>
        </div>
        
        <div class="section">
            <h2>📄 Process MusicXML</h2>
            <p>Upload a MusicXML file (.musicxml, .xml) to generate a video visualization.</p>
            
            <input type="file" id="musicxmlFile" accept=".musicxml,.xml" class="file-input">
            <button onclick="processMusicXML()" id="processMusicXMLBtn" class="btn">Process MusicXML</button>
            
            <div id="musicxmlStatus" class="status" style="display: none;"></div>
            <div id="musicxmlVideoContainer" class="video-container"></div>
        </div>
        
        <div class="section">
            <h2>🔍 Health Check</h2>
            <button onclick="checkHealth()" class="btn">Check API Health</button>
            <div id="healthStatus" class="status" style="display: none;"></div>
        </div>
    </div>

    <script>
        const API_BASE_URL = document.getElementById('apiUrl').value;
        
        function showStatus(elementId, message, type = 'info') {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `status ${type}`;
            element.style.display = 'block';
        }
        
        function hideStatus(elementId) {
            document.getElementById(elementId).style.display = 'none';
        }
        
        function setLoading(buttonId, loading) {
            const button = document.getElementById(buttonId);
            if (loading) {
                button.disabled = true;
                button.innerHTML = '<span class="loading"></span> Processing...';
            } else {
                button.disabled = false;
                button.innerHTML = button.innerHTML.replace('<span class="loading"></span> Processing...', 
                    button.innerHTML.includes('Process Image') ? 'Process Image' : 'Process MusicXML');
            }
        }
        
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE_URL}/health`);
                const data = await response.json();
                
                if (response.ok) {
                    showStatus('healthStatus', `✅ API is healthy! Service: ${data.service}`, 'success');
                } else {
                    showStatus('healthStatus', `❌ API health check failed: ${data.detail}`, 'error');
                }
            } catch (error) {
                showStatus('healthStatus', `❌ Connection error: ${error.message}`, 'error');
            }
        }
        
        async function processImage() {
            const fileInput = document.getElementById('imageFile');
            const file = fileInput.files[0];
            
            if (!file) {
                showStatus('imageStatus', '❌ Please select an image file', 'error');
                return;
            }
            
            setLoading('processImageBtn', true);
            hideStatus('imageStatus');
            
            try {
                const formData = new FormData();
                formData.append('file', file);
                
                const response = await fetch(`${API_BASE_URL}/process-image`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showStatus('imageStatus', `✅ ${data.message} (${data.notes_count} notes)`, 'success');
                    
                    // Create video element
                    const videoData = atob(data.video_data);
                    const videoBlob = new Blob([new Uint8Array(videoData.length).map((_, i) => videoData.charCodeAt(i))], { type: 'video/mp4' });
                    const videoUrl = URL.createObjectURL(videoBlob);
                    
                    const videoContainer = document.getElementById('imageVideoContainer');
                    videoContainer.innerHTML = `
                        <video controls>
                            <source src="${videoUrl}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                        <p><strong>Generated Video:</strong> ${data.filename}</p>
                    `;
                } else {
                    showStatus('imageStatus', `❌ Error: ${data.detail}`, 'error');
                }
            } catch (error) {
                showStatus('imageStatus', `❌ Error: ${error.message}`, 'error');
            } finally {
                setLoading('processImageBtn', false);
            }
        }
        
        async function processMusicXML() {
            const fileInput = document.getElementById('musicxmlFile');
            const file = fileInput.files[0];
            
            if (!file) {
                showStatus('musicxmlStatus', '❌ Please select a MusicXML file', 'error');
                return;
            }
            
            setLoading('processMusicXMLBtn', true);
            hideStatus('musicxmlStatus');
            
            try {
                const formData = new FormData();
                formData.append('file', file);
                
                const response = await fetch(`${API_BASE_URL}/process-musicxml`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showStatus('musicxmlStatus', `✅ ${data.message} (${data.notes_count} notes)`, 'success');
                    
                    // Create video element
                    const videoData = atob(data.video_data);
                    const videoBlob = new Blob([new Uint8Array(videoData.length).map((_, i) => videoData.charCodeAt(i))], { type: 'video/mp4' });
                    const videoUrl = URL.createObjectURL(videoBlob);
                    
                    const videoContainer = document.getElementById('musicxmlVideoContainer');
                    videoContainer.innerHTML = `
                        <video controls>
                            <source src="${videoUrl}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                        <p><strong>Generated Video:</strong> ${data.filename}</p>
                    `;
                } else {
                    showStatus('musicxmlStatus', `❌ Error: ${data.detail}`, 'error');
                }
            } catch (error) {
                showStatus('musicxmlStatus', `❌ Error: ${error.message}`, 'error');
            } finally {
                setLoading('processMusicXMLBtn', false);
            }
        }
        
        // Update API URL when input changes
        document.getElementById('apiUrl').addEventListener('input', function() {
            window.API_BASE_URL = this.value;
        });
    </script>
</body>
</html>
